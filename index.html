<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>후타바 공원 시뮬레이터</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- BGM 컨트롤 패널 (우상단 고정, 볼륨 + 음소거만) -->
  <div id="bgmPanel" style="
       position:fixed; top:40px; right:14px; z-index:50;
       background:rgba(10,8,5,0.85); color:#eee;
       font-family:'Noto Sans KR',sans-serif; font-size:11px;
       padding:6px 10px; border:1px solid #ffe066; border-radius:8px;
       display:flex; align-items:center; gap:8px;">
    <span style="color:#ffe066; font-weight:bold;">🎵</span>
    <input type="range" min="0" max="100" value="35"
           oninput="AudioMgr.setVolume(this.value/100)" style="width:110px;">
    <button onclick="AudioMgr.toggleMute();
                     this.textContent = AudioMgr.muted ? '🔇' : '🔊';"
            style="background:none; border:none; color:#fff; font-size:14px; cursor:pointer;">🔊</button>
  </div>

  <!-- Load order matters: dependencies first -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/images.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/particle.js"></script>
  <script src="js/world.js"></script>
  <script src="js/item.js"></script>
  <script src="js/house.js"></script>
  <script src="js/pollencloud.js"></script>
  <script src="js/trashcan.js"></script>
  <script src="js/siljangsuk.js"></script>
  <script src="js/human.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/save.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
